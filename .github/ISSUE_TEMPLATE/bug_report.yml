name: Bug report
description: Report a problem with the SDK
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal code to reproduce. Redact any API keys and NIFs.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: vendus version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Traceback
      description: Full traceback if any. Redact PII.
      render: text

name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "overrides/**"
      - "hooks/**"
      - "src/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Cairo/imaging deps (for social cards)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev \
            libjpeg-dev libpng-dev libz-dev pngquant
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
          pip install "mkdocs-material[imaging]"
      - name: Deploy
        # CI=true is set by GitHub Actions, which enables the social plugin
        # (mkdocs.yml: `social.enabled: !ENV [CI, false]`).
        run: mkdocs gh-deploy --force --clean

site_name: vendus Python SDK
site_url: https://vendus.bilouro.com/
site_description: Unofficial Python SDK for the Vendus invoicing API (Portugal)
repo_url: https://github.com/bilouro/vendus-python
repo_name: bilouro/vendus-python
edit_uri: edit/main/docs/

hooks:
  - hooks/sitemap_alias.py

theme:
  name: material
  language: en
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - pt
        - en
  # Social/OG cards are generated only in CI (needs Cairo/Pillow imaging deps).
  # Locally, without CI=true, the plugin is disabled so `mkdocs build` still works.
  - social:
      enabled: !ENV [CI, false]
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: pt
          name: Português
          build: true
          site_name: vendus Python SDK
          site_description: SDK Python não-oficial para a API da Vendus (faturação Portugal)
          nav_translations:
            Home: Início
            Getting Started: Começar
            Installation & Quickstart: Instalação e Quickstart
            Configuration: Configuração
            Documents: Documentos
            Which type to choose?: Qual tipo escolher?
            Invoice: Fatura
            Simplified Invoice: Fatura Simplificada
            Invoice-Receipt: Fatura-Recibo
            Receipt: Recibo
            Credit Note: Nota de Crédito
            Payment methods: Métodos de pagamento
            Recipes: Receitas
            Errors & Troubleshooting: Erros e Troubleshooting
            API Reference: Referência API
            Contributing: Contribuir
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3
            members_order: source
            docstring_style: google

nav:
  - Home: index.md
  - Getting Started:
    - Installation & Quickstart: getting-started/index.md
    - Configuration: getting-started/configuration.md
  - Documents:
    - Which type to choose?: documents/index.md
    - Invoice: documents/invoice.md
    - Simplified Invoice: documents/simplified-invoice.md
    - Invoice-Receipt: documents/invoice-receipt.md
    - Receipt: documents/receipt.md
    - Credit Note: documents/credit-note.md
    - Payment methods: documents/payment-methods.md
  - Recipes:
    - Recipes: recipes/index.md
    - FastAPI: recipes/fastapi.md
    - Flask: recipes/flask.md
    - Django: recipes/django.md
  - Errors & Troubleshooting: errors/index.md
  - API Reference: api/index.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bilouro/vendus-python
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/vendus/

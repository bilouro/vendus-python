site_name: vendus Python SDK
site_url: https://bilouro.github.io/vendus-python/
site_description: SDK Python não-oficial para a API da Vendus (faturação Portugal)
repo_url: https://github.com/bilouro/vendus-python
repo_name: bilouro/vendus-python
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - pt
        - en
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      languages:
        - locale: pt
          default: true
          name: Português
          build: true
        - locale: en
          name: English
          build: true
          site_name: vendus Python SDK
          site_description: Unofficial Python SDK for the Vendus invoicing API
          nav_translations:
            Início: Home
            Começar: Getting Started
            Instalação e Quickstart: Installation & Quickstart
            Configuração: Configuration
            Documentos: Documents
            Qual tipo escolher?: Which type to choose?
            Fatura: Invoice
            Fatura-Recibo: Invoice-Receipt
            Nota de Crédito: Credit Note
            Receitas: Recipes
            Erros e Troubleshooting: Errors & Troubleshooting
            Referência API: API Reference
            Contribuir: Contributing
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3
            members_order: source
            docstring_style: google

nav:
  - Início: index.md
  - Começar:
    - Instalação e Quickstart: getting-started/index.md
    - Configuração: getting-started/configuration.md
  - Documentos:
    - Qual tipo escolher?: documents/index.md
    - Fatura: documents/invoice.md
    - Fatura-Recibo: documents/invoice-receipt.md
    - Nota de Crédito: documents/credit-note.md
  - Receitas:
    - Receitas: recipes/index.md
    - FastAPI: recipes/fastapi.md
    - Flask: recipes/flask.md
    - Django: recipes/django.md
  - Erros e Troubleshooting: errors/index.md
  - Referência API: api/index.md
  - Contribuir: contributing.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bilouro/vendus-python
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/vendus/

[project]
name = "vendus"
version = "0.1.0"
description = "Unofficial Python SDK for the Vendus invoicing API (Portugal)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["vendus", "invoicing", "portugal", "at", "faturacao"]
authors = [{ name = "Victor Bilouro" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
django = ["django>=4.0"]
fastapi = ["fastapi>=0.100"]
flask = ["flask>=2.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "respx>=0.21",
    "mypy>=1.0",
    "ruff>=0.4",
    "pre-commit>=3.0",
    "bandit>=1.7",
]
docs = ["mkdocs-material", "mkdocstrings[python]", "mkdocs-static-i18n"]

[project.urls]
Homepage = "https://github.com/bilouro/vendus-python"
Documentation = "https://bilouro.github.io/vendus-python/"
Issues = "https://github.com/bilouro/vendus-python/issues"
Changelog = "https://github.com/bilouro/vendus-python/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vendus"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "PT", "RUF"]
# UP007/UP045: we use Optional[...]/Union[...] in Pydantic models because
# Pydantic evaluates annotations at runtime and PEP 604 (X | None) fails on Python 3.9.
ignore = ["S101", "UP007", "UP045", "S105", "S106"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests hit the real Vendus API, so they are excluded by default.
# Run them explicitly with `pytest -m integration --no-cov` (needs VENDUS_API_KEY
# + VENDUS_REGISTER_ID; they issue test-mode, non-fiscal documents).
addopts = "--cov=vendus --cov-report=term-missing --cov-fail-under=85 -m 'not integration'"
asyncio_mode = "auto"
markers = [
    "integration: live tests against the real Vendus API in test mode (run with '-m integration')",
]

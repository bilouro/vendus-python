[project]
name = "vendus"
version = "0.1.2"
description = "Unofficial Python SDK for the Vendus invoicing & POS API (Portugal): issue invoices, invoice-receipts, receipts and credit notes — AT faturação, typed, sync + async."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
    "vendus", "invoicing", "invoice", "faturacao", "fatura", "recibo",
    "nota-de-credito", "portugal", "spain", "at", "saft", "atcud",
    "e-invoicing", "billing", "pos", "vat", "iva", "sdk", "api",
]
authors = [{ name = "Victor Bilouro", email = "consulting@bilouro.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Natural Language :: English",
    "Natural Language :: Portuguese",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
django = ["django>=4.2.30"]
fastapi = ["fastapi>=0.100"]
flask = ["flask>=2.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "respx>=0.21",
    "mypy>=1.0",
    "ruff>=0.4",
    "pre-commit>=3.0",
    "bandit>=1.7",
]
docs = ["mkdocs-material", "mkdocstrings[python]", "mkdocs-static-i18n"]

[project.urls]
Homepage = "https://github.com/bilouro/vendus-python"
Documentation = "https://vendus.bilouro.com/"
Source = "https://github.com/bilouro/vendus-python"
Issues = "https://github.com/bilouro/vendus-python/issues"
Changelog = "https://github.com/bilouro/vendus-python/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vendus"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "PT", "RUF"]
# UP007/UP045: we use Optional[...]/Union[...] in Pydantic models because
# Pydantic evaluates annotations at runtime and PEP 604 (X | None) fails on Python 3.9.
ignore = ["S101", "UP007", "UP045", "S105", "S106"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests hit the real Vendus API, so they are excluded by default.
# Run them explicitly with `pytest -m integration --no-cov` (needs VENDUS_API_KEY
# + VENDUS_REGISTER_ID; they issue test-mode, non-fiscal documents).
addopts = "--cov=vendus --cov-report=term-missing --cov-fail-under=85 -m 'not integration'"
asyncio_mode = "auto"
markers = [
    "integration: live tests against the real Vendus API in test mode (run with '-m integration')",
]
